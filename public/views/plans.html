<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Plans | GymMS Pro</title>


<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<link 
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
rel="stylesheet">


<link 
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
rel="stylesheet">


<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">


<link rel="stylesheet" href="/css/plans.css">

<link rel="stylesheet" href="/css/main.css">


    <link rel="stylesheet" href="/css/main.css?v=final-common">
    <link rel="stylesheet" href="/css/common.css?v=1">

</head>


<body>


<div class="wrapper">


<!-- Sidebar -->

<aside class="sidebar">


<div class="logo">

<i class="fa-solid fa-dumbbell"></i>

<span>GymMS Pro</span>

</div>



<ul class="menu">


<li>

<a href="/dashboard">

<i class="bi bi-grid-fill"></i>

Dashboard

</a>

</li>



<li>

<a href="/members">

<i class="bi bi-people-fill"></i>

Members

</a>

</li>




<li>

<a href="/payments">

<i class="bi bi-wallet2"></i>

Payments

</a>

</li>




<li>

<a href="/attendance">

<i class="bi bi-calendar-check-fill"></i>

Attendance

</a>

</li>




<li>

<a href="/trainer">

<i class="bi bi-person-badge-fill"></i>

Trainers

</a>

</li>




<li class="active">

<a href="/plans">

<i class="bi bi-card-list"></i>

Plans

</a>

</li>




</ul>


</aside>






<!-- Main -->


<div class="main">



<header class="topbar">


<div>

<h2>

Membership Plans

</h2>


<p>

Manage gym membership plans

</p>

</div>



<button
class="btn btn-warning"
data-bs-toggle="modal"
data-bs-target="#planModal">


<i class="fa fa-plus"></i>

Add Plan


</button>



</header>






<!-- Statistics -->


<div class="row g-4">


<div class="col-lg-4">


<div class="stat-card">


<i class="fa-solid fa-layer-group"></i>


<div>

<h5>Total Plans</h5>

<h2 id="planCount">
0
</h2>

</div>


</div>


</div>





<div class="col-lg-4">


<div class="stat-card">


<i class="fa-solid fa-indian-rupee-sign"></i>


<div>

<h5>Average Price</h5>

<h2 id="avgPrice">
$0
</h2>

</div>


</div>


</div>






<div class="col-lg-4">


<div class="stat-card">


<i class="fa-solid fa-calendar-days"></i>


<div>

<h5>Active Plans</h5>

<h2 id="activePlans">
0
</h2>

</div>


</div>


</div>


</div>









<!-- Table -->


<div class="card mt-4 table-card">


<div class="card-header">


<h5>

<i class="fa-solid fa-list"></i>

Plan List

</h5>


</div>




<div class="card-body">


<div class="table-responsive">


<table class="table align-middle">


<thead>


<tr>

<th>ID</th>

<th>Plan Name</th>

<th>Duration</th>

<th>Price</th>

<th>Status</th>

<th>Action</th>


</tr>


</thead>



<tbody id="planTable">


<tr>

<td colspan="6" class="text-center">

No Plans Available

</td>

</tr>


</tbody>



</table>


</div>


</div>


</div>









<!-- Add Plan Modal -->


<div class="modal fade" id="planModal">


<div class="modal-dialog modal-lg modal-dialog-centered">


<div class="modal-content">



<div class="modal-header">


<h4>

<i class="fa-solid fa-plus"></i>

Add Plan

</h4>


<button 
class="btn-close"
data-bs-dismiss="modal">

</button>


</div>





<div class="modal-body">


<form id="planForm">


<div class="row">


<div class="col-md-6 mb-3">


<label>
Plan ID
</label>


<input
type="text"
id="planId"
class="form-control"
placeholder="PLAN001"
required>


</div>





<div class="col-md-6 mb-3">


<label>
Plan Name
</label>


<input
type="text"
id="name"
class="form-control"
placeholder="Monthly"
required>


</div>





<div class="col-md-6 mb-3">


<label>
Duration (Days)
</label>


<input
type="number"
id="duration"
class="form-control"
placeholder="30"
required>


</div>





<div class="col-md-6 mb-3">


<label>
Price
</label>


<input
type="number"
id="price"
class="form-control"
placeholder="999"
required>


</div>



</div>





<button class="btn btn-warning w-100 btn-lg">


<i class="fa-solid fa-floppy-disk"></i>

Save Plan


</button>



</form>


</div>


</div>


</div>


</div>









<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<script src="/js/plans.js"></script>


<script src="/js/mobile-nav.js?v=1"></script>
</body>


</html>
