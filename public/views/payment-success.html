<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Payment Successful | GymMS Pro
</title>


<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<link 
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
rel="stylesheet">



<style>

body{

    background:#f4f6f9;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;

}


.success-card{

    width:600px;
    background:white;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);

}


.logo{

    font-size:28px;
    font-weight:bold;
    margin-bottom:20px;

}


.logo i{

    color:#198754;

}


.success-icon{

    font-size:80px;

}


.details{

    background:#f8f9fa;
    padding:25px;
    border-radius:15px;
    text-align:left;

}


.details p{

    margin-bottom:12px;

}


.details strong{

    width:170px;
    display:inline-block;

}


.btn-home{

    margin-top:20px;

}


</style>


</head>



<body>



<div class="success-card">



<div class="logo">

<i class="fa-solid fa-dumbbell"></i>

GymMS Pro

</div>




<div class="success-icon">

✅

</div>




<h2 class="text-success">

Payment Successful

</h2>




<p>

Your Gym Membership has been Activated Successfully.

</p>



<hr>





<div class="details">


<h5 class="mb-3">

Payment Receipt

</h5>




<p>
<strong>Member Name:</strong>
<span id="memberName">-</span>
</p>



<p>
<strong>Email:</strong>
<span id="email">-</span>
</p>



<p>
<strong>Plan:</strong>
<span id="plan">-</span>
</p>



<p>
<strong>Amount:</strong>
₹<span id="amount">-</span>
</p>



<p>
<strong>Payment ID:</strong>
<span id="paymentId">-</span>
</p>



<p>
<strong>Transaction ID:</strong>
<span id="transactionId">-</span>
</p>



<p>
<strong>Payment Method:</strong>
<span id="method">Razorpay</span>
</p>



<p>
<strong>Join Date:</strong>
<span id="joinDate">-</span>
</p>



<p>
<strong>Expiry Date:</strong>
<span id="expiryDate">-</span>
</p>



</div>





<p class="mt-4 text-muted">

Thank you for choosing GymMS Pro.

</p>





<button 

class="btn btn-success btn-home"

onclick="goHome()">


<i class="fa-solid fa-house"></i>

Go To Home


</button>



</div>








<script>



const paymentData = JSON.parse(

localStorage.getItem("paymentData")

);



if(paymentData){



// Display Data


document.getElementById("memberName").innerText =
paymentData.name || "-";


document.getElementById("email").innerText =
paymentData.email || "-";


document.getElementById("plan").innerText =
paymentData.plan || "-";


document.getElementById("amount").innerText =
paymentData.amount || "-";


document.getElementById("paymentId").innerText =
paymentData.paymentId || "-";


document.getElementById("transactionId").innerText =
paymentData.transactionId || paymentData.paymentId || "-";


document.getElementById("method").innerText =
paymentData.paymentMethod || "Razorpay";


document.getElementById("joinDate").innerText =
paymentData.joinDate || "-";


document.getElementById("expiryDate").innerText =
paymentData.expiryDate || "-";




// ===============================
// SAVE PAYMENT IN DATABASE
// ===============================


fetch("/payments/add",{


method:"POST",


headers:{


"Content-Type":"application/json"


},


body:JSON.stringify({


memberName:paymentData.name,


memberEmail:paymentData.email,


memberPhone:paymentData.phone || "Not Provided",


plan:paymentData.plan,


amount:Number(paymentData.amount),


paymentDate:new Date(),


method:"Razorpay",


transactionId:
paymentData.transactionId || paymentData.paymentId || "",


status:"Completed"



})


})



.then(res=>res.json())


.then(result=>{


console.log(
"PAYMENT SAVE RESPONSE:",
result
);



if(!result.success){


alert(

"Payment Save Failed: " + result.message

);


}


})



.catch(error=>{


console.log(
"Payment Save Error:",
error
);


});



}



else{


alert("Payment data not found");


}





function goHome(){



localStorage.removeItem("paymentData");


window.location.href="/";


}



</script>





</body>

</html>
